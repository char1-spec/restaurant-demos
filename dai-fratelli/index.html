  <style>
/* ==========================================================
   Restaurant site template — shared styles.
   Colours and fonts are set per restaurant in content.js
   (SITE.theme) and applied as CSS variables by site.js.
   ========================================================== */

:root {
  --bg: #faf7f0;
  --surface: #ffffff;
  --surface-2: #f2ede3;
  --text: #1f1b17;
  --muted: #6b6259;
  --line: rgba(0, 0, 0, .1);
  --accent: #8e1b1b;
  --accent-2: #c9a24a;
  --on-accent: #ffffff;
  --hero-overlay: rgba(10, 8, 6, .55);
  --font-head: Georgia, serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --radius: 14px;
  --maxw: 1120px;
  --shadow: 0 10px 30px rgba(0, 0, 0, .08);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }
a { color: inherit; }
h1, h2, h3 { font-family: var(--font-head); line-height: 1.15; margin: 0 0 .5em; font-weight: 600; }
h2 { font-size: clamp(1.9rem, 4vw, 2.7rem); }
p { margin: 0 0 1em; }
.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 20px; }
.section { padding: clamp(56px, 9vw, 104px) 0; }
.section--alt { background: var(--surface-2); }
.eyebrow {
  display: inline-block; font-size: .78rem; letter-spacing: .16em; text-transform: uppercase;
  color: var(--accent); font-weight: 700; margin-bottom: .8em;
}
.lead { font-size: 1.12rem; color: var(--muted); max-width: 60ch; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- Demo banner (remove when the site goes live) ---------- */
.demo-banner {
  background: #111; color: #f5f5f5; font-size: .85rem; text-align: center;
  padding: 8px 16px; line-height: 1.4;
}
.demo-banner strong { color: #ffd166; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5em;
  padding: .85em 1.4em; border-radius: 999px; font-weight: 700; font-size: .98rem;
  text-decoration: none; border: 2px solid transparent; cursor: pointer;
  transition: transform .15s ease, background .15s ease, color .15s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn--primary { background: var(--accent); color: var(--on-accent); }
.btn--ghost { border-color: rgba(255, 255, 255, .7); color: #fff; }
.btn--ghost:hover { background: rgba(255, 255, 255, .12); }
.btn--outline { border-color: var(--accent); color: var(--accent); }
.btn svg { width: 1.1em; height: 1.1em; }

/* ---------- Header ---------- */
.header {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.header .wrap { display: flex; align-items: center; justify-content: space-between; height: 66px; gap: 16px; }
.brand { font-family: var(--font-head); font-size: 1.35rem; font-weight: 700; text-decoration: none; white-space: nowrap; }
.brand small { display: block; font-family: var(--font-body); font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.nav { display: flex; gap: 22px; align-items: center; }
.nav a { text-decoration: none; font-weight: 600; font-size: .95rem; color: var(--muted); }
.nav a:hover { color: var(--text); }
.nav .btn { color: var(--on-accent); padding: .6em 1.1em; }
@media (max-width: 860px) {
  .nav { display: none; }
  .brand { min-width: 0; }
  .brand small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80vw; }
}

/* ---------- Hero ---------- */
.hero {
  position: relative; min-height: min(88vh, 760px); display: flex; align-items: flex-end;
  color: #fff; background: #222 center/cover no-repeat;
}
.hero::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,.15) 0%, var(--hero-overlay) 55%, rgba(0,0,0,.78) 100%);
}
.hero .wrap { position: relative; padding-bottom: clamp(48px, 8vw, 96px); padding-top: 120px; }
.hero h1 { font-size: clamp(2.6rem, 7vw, 5rem); margin-bottom: .2em; text-wrap: balance; }
.hero p { font-size: clamp(1.05rem, 2vw, 1.3rem); max-width: 46ch; opacity: .95; }
.hero .eyebrow { color: #fff; opacity: .9; text-shadow: 0 1px 8px rgba(0,0,0,.5); }
.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 28px; font-size: .95rem; opacity: .95; }
.badge {
  display: inline-flex; align-items: center; gap: .45em; padding: .35em .85em; border-radius: 999px;
  background: rgba(255,255,255,.14); backdrop-filter: blur(6px); font-weight: 600; font-size: .9rem;
}
.badge svg { width: 1em; height: 1em; flex: 0 0 auto; }
.badge .dot { width: .6em; height: .6em; border-radius: 50%; background: #9ca3af; }
.badge.is-open .dot { background: #34d399; box-shadow: 0 0 0 4px rgba(52,211,153,.25); }
.badge.is-closed .dot { background: #f87171; }

/* ---------- Highlights ---------- */
.highlights { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; margin-top: -48px; position: relative; z-index: 2; }
.highlight {
  background: var(--surface); border-radius: var(--radius); padding: 22px 22px 18px; box-shadow: var(--shadow);
  border-top: 4px solid var(--accent-2);
}
.highlight h3 { font-size: 1.15rem; margin-bottom: .3em; }
.highlight p { color: var(--muted); font-size: .96rem; margin: 0; }

/* ---------- Menu ---------- */
.menu-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
.menu-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.search {
  appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--text);
  border-radius: 999px; padding: .7em 1.1em; font: inherit; font-size: .95rem; min-width: 230px;
}
.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 24px; scrollbar-width: thin; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); color: var(--text);
  border-radius: 999px; padding: .5em 1.05em; font: inherit; font-size: .92rem; font-weight: 600; cursor: pointer;
}
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.menu-cat { margin-bottom: 34px; }
.menu-cat h3 { font-size: 1.5rem; padding-bottom: .4em; border-bottom: 2px solid var(--accent-2); display: inline-block; }
.menu-cat > p { color: var(--muted); font-size: .95rem; }
.menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 6px 40px; margin-top: 10px; }
.dish { display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; padding: 14px 0; border-bottom: 1px dashed var(--line); }
.dish-name { font-weight: 700; }
.dish-num { color: var(--accent); font-weight: 700; margin-right: .4em; font-variant-numeric: tabular-nums; }
.dish-price { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.dish-desc { grid-column: 1 / -1; color: var(--muted); font-size: .93rem; }
.tag {
  display: inline-block; font-size: .7rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  padding: .15em .55em; border-radius: 6px; margin-left: .4em; vertical-align: .15em;
  background: color-mix(in srgb, var(--accent-2) 25%, transparent); color: var(--text);
}
.menu-note { color: var(--muted); font-size: .9rem; margin-top: 10px; }
.empty { color: var(--muted); padding: 20px 0; }

/* ---------- About ---------- */
.about { display: grid; grid-template-columns: 1.1fr 1fr; gap: clamp(28px, 5vw, 64px); align-items: center; }
.about img { border-radius: var(--radius); aspect-ratio: 4/3; object-fit: cover; width: 100%; box-shadow: var(--shadow); }
.facts { display: flex; flex-wrap: wrap; gap: 26px; margin-top: 18px; }
.fact strong { display: block; font-family: var(--font-head); font-size: 2rem; color: var(--accent); line-height: 1; }
.fact span { color: var(--muted); font-size: .9rem; }
@media (max-width: 860px) { .about { grid-template-columns: 1fr; } }

/* ---------- Gallery ---------- */
.gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.gallery img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 10px; }

/* ---------- Visit: hours + map ---------- */
.visit { display: grid; grid-template-columns: 1fr 1.2fr; gap: 28px; }
.card { background: var(--surface); border-radius: var(--radius); padding: 26px; box-shadow: var(--shadow); }
.hours { width: 100%; border-collapse: collapse; }
.hours td { padding: 8px 0; border-bottom: 1px solid var(--line); }
.hours td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.hours td[colspan] { text-align: left; color: var(--muted); }
.hours tr.today td { font-weight: 700; color: var(--accent); }
.contact-list { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 10px; }
.contact-list a { text-decoration: none; font-weight: 600; }
.contact-list svg { width: 1.05em; height: 1.05em; vertical-align: -.15em; margin-right: .5em; color: var(--accent); }
.map { border: 0; width: 100%; height: 100%; min-height: 360px; border-radius: var(--radius); box-shadow: var(--shadow); }
@media (max-width: 860px) { .visit { grid-template-columns: 1fr; } }

/* ---------- Footer ---------- */
.footer { background: #111; color: #cfcfcf; padding: 40px 0 110px; font-size: .92rem; }
.footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 18px; }
.footer a { color: #fff; }
@media (min-width: 861px) { .footer { padding-bottom: 40px; } }

/* ---------- Sticky mobile action bar ---------- */
.actionbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: none;
  grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line);
  border-top: 1px solid var(--line); box-shadow: 0 -6px 20px rgba(0,0,0,.12);
}
.actionbar a {
  background: var(--surface); text-decoration: none; text-align: center; padding: 10px 4px 12px;
  font-size: .78rem; font-weight: 700; color: var(--text);
}
.actionbar a.primary { background: var(--accent); color: var(--on-accent); }
.actionbar svg { display: block; margin: 0 auto 3px; width: 22px; height: 22px; }
@media (max-width: 860px) { .actionbar { display: grid; } }

/* ---------- Dark theme tweaks ---------- */
body.theme-dark .header { background: color-mix(in srgb, var(--bg) 88%, transparent); }
body.theme-dark .search, body.theme-dark .tab { background: var(--surface); }
body.theme-dark .footer { background: #000; }

</style>

    }
    return { open: false, label: "Nu gesloten" };
  }

  // ---------- sections ----------
  var C = S.contact || {};
  var tel = C.phone ? "tel:" + C.phone.replace(/[^\d+]/g, "") : "#contact";
  var mapsLink = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(C.mapsQuery || (S.name + " " + (C.address || "")));
  var primary = S.primaryAction || { label: "Bel ons", href: tel, icon: "phone" };

  function demoBanner() {
    if (!S.demo || !S.demo.show) return "";
    return '<div class="demo-banner"><strong>Voorbeeldontwerp</strong> voor ' + esc(S.name) +
      (S.demo.madeBy ? " · gemaakt door " + esc(S.demo.madeBy) : "") +
      (S.demo.note ? " · " + esc(S.demo.note) : "") + "</div>";
  }

  function header() {
    var links = [];
    if (S.menu) links.push('<a href="#menu">' + esc(S.menu.navLabel || "Menu") + "</a>");
    if (S.about) links.push('<a href="#over">Over ons</a>');
    links.push('<a href="#bezoek">Openingstijden</a>');
    links.push('<a href="#contact">Contact</a>');
    links.push('<a class="btn btn--primary" href="' + esc(primary.href) + '">' + esc(primary.label) + "</a>");
    return '<header class="header"><div class="wrap"><a class="brand" href="#top">' + esc(S.name) +
      (S.city ? "<small>" + esc(S.cuisineShort || S.cuisine || "") + " · " + esc(S.city) + "</small>" : "") +
      '</a><nav class="nav" aria-label="Hoofdmenu">' + links.join("") + "</nav></div></header>";
  }

  function hero() {
    var st = openStatus();
    var meta = [];
    if (st) meta.push('<span class="badge ' + (st.open ? "is-open" : "is-closed") + '"><span class="dot"></span>' + esc(st.label) + "</span>");
    if (S.rating) meta.push('<span class="badge">' + ICON.star + " " + esc(String(S.rating.score).replace(".", ",")) + " · " + esc(S.rating.count) + " Google-reviews</span>");
    if (C.address) meta.push('<span class="badge">' + ICON.pin + " " + esc(C.addressShort || C.address) + "</span>");
    var h = S.hero || {};
    return '<section class="hero" id="top" style="background-image:url(\'' + esc(h.image) + '\')" role="img" aria-label="' + esc(h.alt || S.name) + '">' +
      '<div class="wrap">' + (S.eyebrow ? '<span class="eyebrow">' + esc(S.eyebrow) + "</span>" : "") +
      "<h1>" + esc(S.name) + "</h1><p>" + esc(S.tagline) + "</p>" +
      '<div class="hero-actions"><a class="btn btn--primary" href="' + esc(primary.href) + '">' + (ICON[primary.icon] || "") + esc(primary.label) + "</a>" +
      (S.menu ? '<a class="btn btn--ghost" href="#menu">Bekijk de kaart</a>' : "") +
      '<a class="btn btn--ghost" href="' + mapsLink + '" target="_blank" rel="noopener">' + ICON.pin + "Route</a></div>" +
      '<div class="hero-meta">' + meta.join("") + "</div></div></section>";
  }

  function highlights() {
    if (!S.highlights || !S.highlights.length) return "";
    return '<div class="wrap"><div class="highlights">' + S.highlights.map(function (x) {
      return '<div class="highlight"><h3>' + esc(x.title) + "</h3><p>" + esc(x.text) + "</p></div>";
    }).join("") + "</div></div>";
  }

  function dishHtml(d) {
    var tags = (d.tags || []).map(function (tg) { return '<span class="tag">' + esc(tg) + "</span>"; }).join("");
    return '<div class="dish"><div class="dish-name">' + (d.num ? '<span class="dish-num">' + esc(d.num) + "</span>" : "") + esc(d.name) + tags + "</div>" +
      '<div class="dish-price">' + price(d.price) + "</div>" + (d.desc ? '<div class="dish-desc">' + esc(d.desc) + "</div>" : "") + "</div>";
  }

  function menu() {
    if (!S.menu) return "";
    var M = S.menu;
    var tabs = '<div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="true" data-cat="*">Alles</button>' +
      M.categories.map(function (cat, i) { return '<button class="tab" role="tab" aria-selected="false" data-cat="' + i + '">' + esc(cat.name) + "</button>"; }).join("") + "</div>";
    return '<section class="section" id="menu"><div class="wrap">' +
      '<div class="menu-head"><div><span class="eyebrow">' + esc(M.eyebrow || "De kaart") + "</span><h2>" + esc(M.title || "Menu") + "</h2>" +
      (M.intro ? '<p class="lead">' + esc(M.intro) + "</p>" : "") + "</div>" +
      '<div class="menu-tools"><label class="sr-only" for="q">Zoek een gerecht</label><input id="q" class="search" type="search" placeholder="Zoek een gerecht…"></div></div>' +
      tabs + '<div id="menu-body"></div>' + (M.note ? '<p class="menu-note">' + esc(M.note) + "</p>" : "") + "</div></section>";
  }

  function renderMenu(catFilter, q) {
    var M = S.menu, body = document.getElementById("menu-body"); if (!M || !body) return;
    q = (q || "").trim().toLowerCase();
    var out = M.categories.map(function (cat, i) {
      if (catFilter !== "*" && String(i) !== catFilter) return "";
      var items = cat.items.filter(function (d) {
        return !q || (d.name + " " + (d.desc || "") + " " + (d.tags || []).join(" ") + " " + (d.num || "")).toLowerCase().indexOf(q) > -1;
      });
      if (!items.length) return "";
      return '<div class="menu-cat"><h3>' + esc(cat.name) + "</h3>" + (cat.note ? "<p>" + esc(cat.note) + "</p>" : "") +
        '<div class="menu-grid">' + items.map(dishHtml).join("") + "</div></div>";
    }).join("");
    body.innerHTML = out || '<p class="empty">Geen gerechten gevonden.</p>';
  }

  function about() {
    if (!S.about) return "";
    var A = S.about;
    return '<section class="section section--alt" id="over"><div class="wrap about"><div>' +
      '<span class="eyebrow">' + esc(A.eyebrow || "Over ons") + "</span><h2>" + esc(A.title) + "</h2>" +
      (A.text || []).map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") +
      (A.facts ? '<div class="facts">' + A.facts.map(function (f) { return '<div class="fact"><strong>' + esc(f.value) + "</strong><span>" + esc(f.label) + "</span></div>"; }).join("") + "</div>" : "") +
      "</div>" + (A.image ? '<img src="' + esc(A.image) + '" alt="' + esc(A.imageAlt || "") + '" loading="lazy">' : "") + "</div></section>";
  }

  function gallery() {
    if (!S.gallery || !S.gallery.length) return "";
    return '<section class="section"><div class="wrap"><span class="eyebrow">Sfeer</span><h2>' + esc(S.galleryTitle || "Een kijkje bij ons") + '</h2><div class="gallery">' +
      S.gallery.map(function (g) { return '<img src="' + esc(g.src) + '" alt="' + esc(g.alt || "") + '" loading="lazy">'; }).join("") + "</div></div></section>";
  }

  function visit() {
    var today = nowInBelgiumNL().day;
    var rows = (S.hours || []).map(function (h, i) {
      var label = h ? h.split(",").map(function (s) { return s.trim().replace("-", " – "); }).join(" & ") : "Gesloten";
      return '<tr class="' + (i === today ? "today" : "") + '"><td>' + DAYS[i] + "</td><td>" + esc(label) + "</td></tr>";
    }).join("");
    if (!rows) rows = '<tr><td colspan="2">' + esc(S.hoursNote || "Openingstijden volgen binnenkort.") + "</td></tr>";
    var mapSrc = "https://www.google.com/maps?q=" + encodeURIComponent(C.mapsQuery || (S.name + " " + (C.address || ""))) + "&output=embed";
    return '<section class="section section--alt" id="bezoek"><div class="wrap"><span class="eyebrow">Bezoek ons</span><h2>Openingstijden &amp; locatie</h2>' +
      '<div class="visit"><div class="card" id="contact"><table class="hours"><tbody>' + rows + "</tbody></table>" +
      (S.hoursNote && S.hours ? '<p class="menu-note">' + esc(S.hoursNote) + "</p>" : "") +
      '<ul class="contact-list">' +
      (C.address ? '<li><a href="' + mapsLink + '" target="_blank" rel="noopener">' + ICON.pin + esc(C.address) + "</a></li>" : "") +
      (C.phone ? '<li><a href="' + tel + '">' + ICON.phone + esc(C.phoneDisplay || C.phone) + "</a></li>" : "") +
      (C.email ? '<li><a href="mailto:' + esc(C.email) + '">' + ICON.mail + esc(C.email) + "</a></li>" : "") +
      "</ul>" + (C.extra ? '<p class="menu-note">' + esc(C.extra) + "</p>" : "") + "</div>" +
      '<iframe class="map" title="Kaart naar ' + esc(S.name) + '" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="' + mapSrc + '"></iframe></div></div></section>';
  }

  function footer() {
    var soc = S.social || {};
    var links = [];
    if (soc.facebook) links.push('<a href="' + esc(soc.facebook) + '" target="_blank" rel="noopener">Facebook</a>');
    if (soc.instagram) links.push('<a href="' + esc(soc.instagram) + '" target="_blank" rel="noopener">Instagram</a>');
    return '<footer class="footer"><div class="wrap"><div><strong style="color:#fff">' + esc(S.name) + "</strong><br>" + esc(C.address || "") +
      (S.legal ? "<br>" + esc(S.legal) : "") + "</div><div>" + links.join(" · ") +
      "<br>© " + new Date().getFullYear() + " " + esc(S.name) + "</div></div></footer>";
  }

  function actionbar() {
    return '<nav class="actionbar" aria-label="Snelle acties">' +
      '<a href="' + tel + '">' + ICON.phone + "Bellen</a>" +
      '<a href="' + mapsLink + '" target="_blank" rel="noopener">' + ICON.pin + "Route</a>" +
      '<a class="primary" href="' + esc(primary.href) + '">' + (ICON[primary.icon] || ICON.cal) + esc(primary.shortLabel || primary.label) + "</a></nav>";
  }

  // ---------- render ----------
  document.getElementById("app").innerHTML =
    demoBanner() + header() + "<main>" + hero() + highlights() + menu() + about() + gallery() + visit() + "</main>" + footer() + actionbar();

  var cat = "*", q = "";
  renderMenu(cat, q);
  document.querySelectorAll(".tab").forEach(function (b) {
    b.addEventListener("click", function () {
      document.querySelectorAll(".tab").forEach(function (x) { x.setAttribute("aria-selected", "false"); });
      b.setAttribute("aria-selected", "true"); cat = b.getAttribute("data-cat"); renderMenu(cat, q);
    });
  });
  var input = document.getElementById("q");
  if (input) input.addEventListener("input", function () { q = input.value; renderMenu(cat, q); });
})();

</script>
</body>
</html>
